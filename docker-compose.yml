services:
  # MySQL Database
  db:
    image: mariadb:10.11
    container_name: panilino-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: panilino
      MARIADB_ROOT_PASSWORD: root
      MARIADB_PASSWORD: password
      MARIADB_USER: user
      TZ: Europe/Chisinau
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panilino-backend
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backend:/var/www
    environment:
      APP_URL: http://localhost:8000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: panilino
      DB_USERNAME: user
      DB_PASSWORD: password
      TZ: Europe/Chisinau
    ports: [] # backend doesn't need ports, handled by nginx
  
  # Nginx for Backend
  backend-nginx:
    image: nginx:stable-alpine
    container_name: panilino-backend-nginx
    restart: unless-stopped
    environment:
      TZ: Europe/Chisinau
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/backend-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # Admin Frontend (Vite + Refine)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: panilino-admin
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend-nginx

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: panilino-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data:
